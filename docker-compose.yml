# JoJo Tracker — déploiement : `cp .env.example .env`, remplir les secrets, puis
#   docker compose up -d --build
# L'appli écoute sur ${APP_BIND}:${APP_PORT} (127.0.0.1:3000 par défaut) derrière votre reverse proxy HTTPS.
name: jojo-tracker

services:
  app:
    build:
      context: .
    image: jojo-tracker:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000'
    environment:
      NODE_ENV: production
      APP_ORIGIN: ${APP_ORIGIN:?APP_ORIGIN doit être défini dans .env (ex. https://jojo.example.com)}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      INVITE_CODE: ${INVITE_CODE:-}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: ${TRUST_PROXY:-loopback,linklocal,uniquelocal}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-jojo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-jojo}
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jojo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans .env}
      POSTGRES_DB: ${POSTGRES_DB:-jojo}
    # PostgreSQL 18 : le volume se monte sur /var/lib/postgresql (PGDATA = /var/lib/postgresql/18/docker).
    volumes:
      - pgdata:/var/lib/postgresql
    # Aucun port publié sur l'hôte : seule l'appli y accède, via le réseau interne de compose.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
